services:
  - type: web
    name: aloa-v3-backend
    env: python
    region: oregon
    plan: free
    branch: development/aloa-v3
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: ALLOWED_ORIGINS
        value: https://aloav3.com,https://www.aloav3.com,http://localhost:3000,http://127.0.0.1:3000
